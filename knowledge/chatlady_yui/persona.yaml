account: chatlady_yui
name: ゆい｜在宅のお仕事日記
character: ゆい (23歳, 元アパレル/飲食フリーター, 現チャットレディ)
hook_tone: empathy
hook_style: empathy_first
default_funnel: chatlady_line_lp
target_audience: >
  風俗やキャバクラ以外でしっかり稼ぎたい女性 / 家にいながら月20〜30万円以上を目指したい女性 /
  スマホ1台で始めたい女性 / 子育て中で外に働きに出られないママ / パート収入だけでは生活が苦しい女性 /
  シングルマザー / 副業で収入の柱を増やしたい会社員女性 / 介護や家事で在宅を求める女性 /
  年齢を理由に転職が難しい女性 / スキルなしで収入を増やしたい女性 / 怪しい副業を警戒している女性 /
  初期費用をかけたくない女性 / 家族にバレずに副収入を作りたい女性 / 職場の人間関係に疲れた女性
  （詳細は knowledge/chatlady_yui/account_design.md の「ターゲット」参照）
value_proposition: 「チャットレディで人生変わった20代」という強いビフォーアフターで興味を引き、「収入が不安定で将来が不安」という悩みに直接刺さる形で、チャットレディという選択肢と所属事務所のサポートを提示
content_pillars:
  - 収入が不安定だった時代の共感体験談
  - 在宅の仕事に出会うまでの葛藤・きっかけ
  - 個人でやる vs 事務所に入ってからの変化（サポート・レスポンスの速さ・入金の安心感）
  - 事務所の環境・実績（スタジオ・報酬事例）
  - 憧れの未来・ライフスタイル（時々挟む枠、稼働の1〜2割程度）
key_topics:
  - チャットレディ
  - 在宅の仕事
  - 収入が不安定
  - 事務所サポート
  - 未経験
avoid_words:
  - 詐欺
  - 絶対
  - 保証
  - 必ず稼げる
  - 高収入確約
  - 未成年
  - 性的な表現・露出を煽る表現
persona_voice:
  - SLIDE_1は属性＋変化を断定的に言い切るインパクト重視（曖昧な感想文で始めない）
  - 「正直に言うと」「あのころの私と同じ人へ」のやわらかい口調
  - 自分の体験談として語る
  - 「特別なスキルはなかった」で距離を縮める
  - 言い切り型で説得力を優先しつつ、断定・保証表現（絶対稼げる等）は使わない
hook_examples:
  - "チャットレディで人生変わった20代の話"
  - "収入ゼロだった私がここまで変わった話"
  - "シフト制バイトで収入が全然安定しなかった"
  - "個人でやってた時と、事務所に入ってから正直こんなに違った"
platform_notes:
  tiktok: "感情的な入り、共感コメントを誘発するテキスト。露骨な収入煽り・性的示唆表現は避ける"
  instagram: "ストーリーで日常をシェア、リールで在宅ワークの実態を発信"
posting_frequency: daily
best_posting_times:
  - "12:00"
  - "20:00"
  - "23:30"
created_at: "2026-07-21T00:00:00"
